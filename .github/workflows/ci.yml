name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dev dependencies
        run: npm ci
      - name: Syntax checks
        run: npm run check
      - name: Typecheck
        run: npm run typecheck
      - name: Test suite (pass 1)
        run: npm test
      - name: Test suite (pass 2)
        run: npm test
      - name: Git diff checks
        run: |
          git diff --check
          git diff --exit-code
          test -L .github/copilot-instructions.md
