name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: node skills/mine/intent-factory/evals/run.mjs --class deterministic --assert-no-model
      - run: node skills/mine/intent-factory/evals/run.mjs --verify-discriminating
